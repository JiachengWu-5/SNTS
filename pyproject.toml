[project]
name = "shanydoc"
version = "0.1.0"
description = "SHANYDOC (SNTS, Shanydoc Novel Terminal System): a local web app for writing novels with a local llama.cpp-compatible LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SHANYDOC" }]
dependencies = [
  "fastapi==0.162.4",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "python-multipart==0.0.33",
  "reportlab==5.1.0",
  "pillow==12.3.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
